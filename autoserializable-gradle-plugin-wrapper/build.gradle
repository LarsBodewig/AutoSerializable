//file:noinspection GrUnresolvedAccess
buildscript {
    group = "dev.bodewig.autoserializable"
}

plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation "net.bytebuddy:byte-buddy-gradle-plugin:$byteBuddyVersion"
    implementation "dev.bodewig.autoserializable:autoserializable:$version"
    compileOnly "dev.bodewig.autoserializable:autoserializable-api:$version"
}

java {
    sourceCompatibility = JavaVersion.VERSION_22
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(Javadoc) {
    // The '-quiet' as second argument is actually a hack,
    // since the one paramater addStringOption doesn't seem to
    // work, we extra add '-quiet', which is added anyway by
    // gradle. See https://github.com/gradle/gradle/issues/2354
    // See JDK-8200363 (https://bugs.openjdk.java.net/browse/JDK-8200363)
    // for information about the -Xwerror option.
    options.addStringOption('Xwerror', '-quiet')
}

gradlePlugin {
    //noinspection GroovyAssignabilityCheck
    plugins {
        autoSerializableClasses {
            id = 'dev.bodewig.autoserializable.classes'
            tags.set(['dependencies', 'configuration', 'build', 'java'])
            implementationClass = 'dev.bodewig.autoserializable.gradle.plugin.AutoSerializableClassesGradlePlugin'
        }
        autoSerializableJars {
            id = 'dev.bodewig.autoserializable.jars'
            tags.set(['dependencies', 'configuration', 'build', 'java'])
            implementationClass = 'dev.bodewig.autoserializable.gradle.plugin.AutoSerializableJarsGradlePlugin'
        }
    }
}

publishing {
    publications.withType(MavenPublication) { pub ->
        pom.withXml {
            def pom = asNode()
            def parent = pom.appendNode('parent')
            parent.appendNode('groupId', "$group")
            parent.appendNode('artifactId', 'autoserializable-parent')
            parent.appendNode('version', "$version")
            pom.appendNode('name', 'AutoSerializable gradle plugin')
            pom.appendNode('description', 'Adds a configuration to make dependencies serializable')
        }
    }
    repositories {
        maven {
            name = "CentralStaging"
            url = uri(layout.buildDirectory.dir("temp-repo"))
        }
    }
}

signing {
    useInMemoryPgpKeys(
            project.hasProperty('test') ? file('test-private.key').text : System.getenv('GPG_PRIVATE_KEY'),
            project.hasProperty('test') ? '' : System.getenv('GPG_PASSPHRASE')
    )
    sign publishing.publications
}

tasks.register("publishToCentralStaging", Copy) {
    dependsOn tasks.named("publishAllPublicationsToCentralStagingRepository")
    from layout.buildDirectory.dir("temp-repo")
    into layout.projectDirectory.dir("../target/central-staging")
    exclude "**/maven-metadata*.xml"
    exclude "**/maven-metadata*.xml.md5"
    exclude "**/maven-metadata*.xml.sha1"
    exclude "**/maven-metadata*.xml.sha256"
    exclude "**/maven-metadata*.xml.sha512"
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
