# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

multi-ecosystem-groups:
  java:
    schedule:
      interval: "monthly"

registries:
  maven-gradle:
    type: maven-repository
    url: https://repo.gradle.org/gradle/libs-releases/

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    registries:
      - maven-gradle
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "java"
    cooldown:
      default-days: 7
      semver-major-days: 21

  - package-ecosystem: "gradle"
    directory: "/autoserializable-gradle-plugin-wrapper"
    patterns:
      - "*"
    multi-ecosystem-group: "java"
    cooldown:
      default-days: 7
      semver-major-days: 21

  - package-ecosystem: "gradle"
    directory: "/autoserializable-test"
    patterns:
      - "*"
    multi-ecosystem-group: "java"
    cooldown:
      default-days: 7
      semver-major-days: 21
